services:
  postgres:
    image: postgres:17
    container_name: moducraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moducraft
      POSTGRES_USER: moducraft
      POSTGRES_PASSWORD: moducraft_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - moducraft-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moducraft -d moducraft"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  moducraft-postgres-data:
